name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["leanprover/lean4:v4.33.0", "leanprover/lean4:v4.34.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin toolchain
        run: echo "${{ matrix.toolchain }}" > lean-toolchain
      - uses: leanprover/lean-action@v1
        with:
          build-args: "leanout Fixtures"
          test: false
          lint: false
          use-github-cache: false
      - name: End-to-end tests
        run: tests/run.sh
      - name: Export Init and validate
        run: |
          .lake/build/bin/leanout --stats --axioms -o init.ndjson Init
          .lake/build/bin/leanout --validate init.ndjson
